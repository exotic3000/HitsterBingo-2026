<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Übersicht — Hitster Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="page">
    <div id="conn" class="conn off"></div>

    <div class="flex justify-between items-center mb">
      <h1 class="page-title" style="margin:0;font-size:1.3rem">Übersicht</h1>
      <span id="room-badge" style="font-size:.75rem;color:var(--text-dim);font-family:var(--font-display)"></span>
      <div id="timer" class="timer hidden">1:00</div>
    </div>

    <!-- Round -->
    <div id="sec-category" class="text-center mb hidden">
      <p id="ov-round" style="color:var(--text-dim);font-size:.8rem;font-family:var(--font-display)"></p>
    </div>

    <!-- Scoreboard -->
    <div id="scoreboard" class="card mb hidden" style="max-width:500px;margin-left:auto;margin-right:auto">
      <h3 style="font-size:.85rem;margin-bottom:.75rem;color:var(--gold);text-align:center">Rangliste</h3>
      <div id="score-list"></div>
    </div>

    <!-- All Bingo Cards -->
    <div id="team-cards" class="teams-grid"></div>

    <div id="no-teams" class="card text-center hidden" style="max-width:400px;margin:3rem auto">
      <p style="color:var(--text-dim)">Noch keine Teams verbunden</p>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/overview.js"></script>
</body>
</html>
