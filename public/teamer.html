<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teamer — Hitster Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .team-pick {
      display: flex; align-items: center; gap: .5rem;
      width: 100%; text-align: left; justify-content: flex-start;
    }
  </style>
</head>
<body>
  <div class="page" style="max-width:480px;margin:0 auto">
    <div id="conn" class="conn off"></div>
    <h1 class="page-title" style="font-size:1.5rem;margin-bottom:.25rem">Teamer</h1>
    <p class="subtitle">Bingokarte des betreuten Teams pflegen</p>

    <!-- Team selection -->
    <div id="sec-select" class="card card-glow">
      <h3 style="font-size:.9rem;margin-bottom:.75rem;color:var(--cyan)">Team wählen</h3>
      <div id="team-list" class="flex flex-col gap-sm"></div>
      <p id="no-teams-msg" class="hidden" style="color:var(--text-dim);text-align:center;padding:1rem 0">Noch keine Teams verbunden</p>
    </div>

    <!-- Assigned team's card -->
    <div id="sec-card" class="card card-glow hidden">
      <div class="flex items-center justify-between mb">
        <div class="flex items-center gap-sm">
          <span id="team-emoji" style="font-size:1.5rem"></span>
          <h2 id="team-name" style="font-size:1.1rem"></h2>
        </div>
        <span id="team-score" style="color:var(--text-dim);font-size:.85rem"></span>
      </div>
      <div id="bingo-teamer"></div>
      <p id="team-bingo-msg" class="hidden" style="text-align:center;color:var(--gold);font-family:var(--font-display);margin-top:1rem;font-weight:700">BINGO!</p>
      <button id="btn-switch" class="btn btn-secondary w-full mt">Team wechseln</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/teamer.js"></script>
</body>
</html>
