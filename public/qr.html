<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mitspielen — Hitster Bingo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .qr-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      gap: 2rem;
    }
    .qr-card {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 0 60px rgba(124,58,237,.4), 0 4px 40px rgba(0,0,0,.4);
    }
    .qr-card img {
      display: block;
      width: min(60vw, 60vh, 500px);
      height: min(60vw, 60vh, 500px);
    }
  </style>
</head>
<body>
  <div class="page qr-page">
    <h1 class="page-title" style="margin:0">Jetzt mitspielen!</h1>
    <div class="qr-card" id="qr-card">
      <img id="qr-img" src="" alt="QR-Code zum Beitreten">
    </div>
    <p class="subtitle" style="margin:0">Scannen &amp; Team gründen</p>
  </div>

  <script>
    const room = new URLSearchParams(location.search).get('room');
    if (room) {
      document.getElementById('qr-img').src = '/api/join-qr?room=' + encodeURIComponent(room);
    } else {
      document.getElementById('qr-card').textContent = 'Keine Runde ausgewählt — bitte diesen Link über die Rundenübersicht öffnen.';
      document.getElementById('qr-card').style.cssText += 'color:#0a0e27;font-size:1rem;max-width:360px;text-align:center;padding:2rem';
    }
  </script>
</body>
</html>
